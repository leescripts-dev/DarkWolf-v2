<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eclipse Blog</title>
    <link rel="stylesheet" href="/fonts/chakra-petch.css">
    <link rel="stylesheet" href="/fonts/onest.css">
    <link rel="stylesheet" href="/css/blog-challenge.css">
    <script src="/js/blog-challenge.js" defer></script>
</head>
<body>
    <main class="challenge" aria-live="polite">
        <svg class="mark" viewBox="0 0 120 120" role="img" aria-label="Eclipse">
            <circle class="ring one" cx="60" cy="60" r="31"/>
            <circle class="ring two" cx="60" cy="60" r="42"/>
            <circle class="ring three" cx="60" cy="60" r="52"/>
            <circle class="core" cx="60" cy="60" r="23"/>
            <g class="orbit">
                <circle class="eclipse-shadow" cx="84.5" cy="45.5" r="10.2"/>
                <circle class="moon" cx="84.5" cy="45.5" r="9.5"/>
            </g>
        </svg>
        <h1>Please wait</h1>
        <p>Verifying your browser</p>
        <div class="status" id="challenge-status">Preparing check</div>
    </main>
</body>
</html>
