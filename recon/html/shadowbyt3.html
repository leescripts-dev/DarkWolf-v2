<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowByt3$ 2.0</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #030303;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #0d1a0d 0%, #030303 70%);
        }
        .shield-box {
            text-align: center;
            border: 1px solid rgba(0, 255, 102, 0.3);
            padding: 50px 40px;
            background: #080808;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.1);
            border-radius: 2px;
            width: 420px;
            position: relative;
        }
        .shield-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #00ff66, transparent);
        }
        .brand {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
        }
        .subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            color: #00ff66;
            text-transform: uppercase;
            margin-bottom: 35px;
            opacity: 0.8;
            font-weight: bold;
        }
        .status-text {
            font-size: 13px;
            margin-bottom: 30px;
            color: #888;
            line-height: 1.6;
        }
        button {
            background: #00ff66;
            border: none;
            color: #030303;
            padding: 16px 28px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
        button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 25px #00ff66, 0 0 10px #fff;
            transform: translateY(-1px);
        }
        .footer {
            font-size: 10px;
            color: #333;
            margin-top: 30px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="shield-box">
    <div class="brand">ShadowByt3$ 2.0</div>
    <div class="subtitle">DDoS Prevention</div>
    
    <div class="status-text">
        Verify your path connection.<br>
        This link expires when you exit your browser.
    </div>
    
    <form method="POST" action="">
        <button type="submit" name="verify_me">Verify Session</button>
    </form>
    
    <div class="footer">NODE_SHIELD // REV_2.0</div>
</div>

</body>
</html>
