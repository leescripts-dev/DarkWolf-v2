// Optional friendly titles for a folder-id. Falls back to the
// folder-id itself (capitalized) if not listed here.
const folderTitles = {
  lucidmotors : "Lucidmotors"
};

const grid = document.getElementById('post-grid');
const overlay = document.getElementById('overlay');
const sheetBody = document.getElementById('sheet-body');
const sheetId = document.getElementById('sheet-id');
const sheetBack = document.getElementById('sheet-back');

// Tracks which folder (if any) the currently open post sheet
// was reached from, so the back button knows where to return.
let activeFolderId = null;

/* ---------- group posts by folder-id ---------- */
// Posts sharing the same `folder` value are collapsed into a
// single folder entry for the main grid. Posts without a
// `folder` value render as normal individual cards. Order is
// preserved based on each folder/post's first appearance.
function buildRenderItems(list) {
  const items = [];
  const folderIndex = {};

  list.forEach(p => {
    if (p.folder) {
      if (folderIndex[p.folder] === undefined) {
        folderIndex[p.folder] = items.length;
        items.push({ type: 'folder', folderId: p.folder, posts: [p] });
      } else {
        items[folderIndex[p.folder]].posts.push(p);
      }
    } else {
      items.push({ type: 'post', post: p });
    }
  });

  return items;
}

const renderItems = buildRenderItems(posts);

document.getElementById('post-count').textContent = posts.length + " posts";

renderItems.forEach((item) => {

  if (item.type === 'folder') {
    renderFolderCard(item.folderId, item.posts);
    return;
  }

  renderPostCard(item.post);
});

function folderTitle(folderId) {
  return folderTitles[folderId] || (folderId.charAt(0).toUpperCase() + folderId.slice(1));
}

function renderFolderCard(folderId, folderPosts) {

  // The folder card shows the most recent post's details as
  // its preview, plus a count of everything inside it.
  const preview = folderPosts[folderPosts.length - 1];

  const card = document.createElement('div');
  card.className = 'card folder';
  card.setAttribute('data-folder', folderId);

  card.innerHTML = `
    <div class="card-id">
      <span class="folder-tag"><span class="folder-icon"></span>Folder</span>
      <span class="folder-count">${folderPosts.length} post${folderPosts.length === 1 ? '' : 's'}</span>
    </div>

    <h3>${folderTitle(folderId)}</h3>

    <p>${preview.excerpt || ''}</p>

    <div class="card-foot">
      <span>${preview.date}</span>
      <span class="card-arrow">â</span>
    </div>
  `;

  card.addEventListener('click', () => openFolderSheet(folderId));
  grid.appendChild(card);
}

function renderPostCard(p) {

  const card = document.createElement('div');

  card.className = p.release ? 'card release' : 'card';
  card.setAttribute('data-post', p.id);

  if (p.release) {

    card.innerHTML = `
      <div class="card-id">
        <span>${p.id}</span>
        <span class="release-tag">Release countdown</span>
      </div>

      <h3>${p.title}</h3>

      <div class="card-countdown" id="countdown-${p.id}">
        <div class="box">
          <span class="num cd-d">00</span>
          <span class="lbl">days</span>
        </div>

        <div class="box">
          <span class="num cd-h">00</span>
          <span class="lbl">hrs</span>
        </div>

        <div class="box">
          <span class="num cd-m">00</span>
          <span class="lbl">min</span>
        </div>

        <div class="box">
          <span class="num cd-s">00</span>
          <span class="lbl">sec</span>
        </div>
      </div>

      <div class="card-foot">
        <span>${p.date}</span>
        <span class="card-arrow">â</span>
      </div>
    `;

  } else {

    card.innerHTML = `
      <div class="card-id">
        <span>${p.id}</span>
        <span class="card-cat">${p.cat}</span>
      </div>

      <h3>${p.title}</h3>

      <p>${p.excerpt}</p>

      <div class="card-foot">
        <span>${p.date}</span>
        <span class="card-arrow">â</span>
      </div>
    `;
  }

  card.addEventListener('click', () => {
    activeFolderId = null;
    openSheet(p);
  });
  grid.appendChild(card);

  /*
   * Fixed release date.
   *
   * The countdown is calculated from the actual releaseDate,
   * so refreshing the page or restarting the server does not
   * reset the countdown.
   */
  if (p.release && p.releaseDate) {

    const target = new Date(p.releaseDate).getTime();

    const el = document.getElementById(`countdown-${p.id}`);

    const dEl = el.querySelector('.cd-d');
    const hEl = el.querySelector('.cd-h');
    const mEl = el.querySelector('.cd-m');
    const sEl = el.querySelector('.cd-s');

    function tickCountdown() {

      const diff = Math.max(target - Date.now(), 0);

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);

      dEl.textContent = String(days).padStart(2, '0');
      hEl.textContent = String(hours).padStart(2, '0');
      mEl.textContent = String(minutes).padStart(2, '0');
      sEl.textContent = String(seconds).padStart(2, '0');
    }

    tickCountdown();
    setInterval(tickCountdown, 1000);
  }
}


function openSheet(p) {

  sheetId.textContent = `${p.id} â full record`;
  sheetBack.style.display = activeFolderId ? 'flex' : 'none';

  const specHtml = p.specs

  sheetBody.innerHTML = `

    <div class="sheet-meta">

      <span>${p.id}</span>

    <div class="spec-strip">
      ${specHtml}
    </div>

    ${p.body}
  `;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openFolderSheet(folderId) {

  activeFolderId = folderId;
  sheetBack.style.display = 'none';

  const folderPosts = posts.filter(p => p.folder === folderId);

  sheetId.textContent = `Folder â ${folderTitle(folderId)}`;

  const listHtml = folderPosts.map(p => `

      </div>
      <span class="fli-arrow">â</span>
    </div>
  `).join('');

  sheetBody.innerHTML = `
    <span class="cat">Folder</span>
    <h2>${folderTitle(folderId)}</h2>
    <div class="sheet-meta">
      <span>${folderPosts.length} post${folderPosts.length === 1 ? '' : 's'}</span>
    </div>
    <div class="folder-list">
      ${listHtml}
    </div>
  `;

  sheetBody.querySelectorAll('.folder-list-item').forEach(el => {
    el.addEventListener('click', () => {
      const post = folderPosts.find(p => p.id === el.getAttribute('data-post'));
      if (post) openSheet(post);
    });
  });

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

sheetBack.addEventListener('click', () => {
  if (activeFolderId) openFolderSheet(activeFolderId);
});


function closeSheet() {

  overlay.classList.remove('open');
  document.body.style.overflow = '';
  activeFolderId = null;
}


document
  .getElementById('sheet-close')
  .addEventListener('click', closeSheet);


overlay.addEventListener('click', e => {
