<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gentlecloud Protection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    h1 {
      text-align: center;
      font-size: 2em;
      margin-bottom: 10px;
      color: #6cf;
      text-shadow: 0 0 20px rgba(102, 204, 255, 0.5);
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 0.9em;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(102, 204, 255, 0.2);
      border-top-color: #6cf;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      text-align: center;
      margin: 20px 0;
      font-size: 1.1em;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .checkbox-container:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .checkbox-container input {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      cursor: pointer;
    }
    .error {
      color: #f44;
      text-align: center;
      margin: 20px 0;
      padding: 15px;
      background: rgba(68, 68, 68, 0.1);
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ð¡ï¸ Gentlecloud</h1>
    <p class="subtitle">Verifying your browser...</p>

    <div class="spinner"></div>
    <div class="status" id="status">Initializing security checks...</div>

    <div class="checkbox-container" id="bot-check" style="display:none;">
      <input type="checkbox" id="not-bot-checkbox">
      <label for="not-bot-checkbox">I'm not a bot</label>
    </div>

    <div class="error" id="error"></div>
  </div>

  <script>
    const startTime = Date.now();

    // MOUSE TRACKING (hidden)
    let mouseMovements = [];
    let mouseClicks = 0;

    document.addEventListener('mousemove', (e) => {
      const now = Date.now();
      mouseMovements.push({
        x: e.clientX,
        y: e.clientY,
        t: now - startTime
      });

      if (mouseMovements.length > 100) {
        mouseMovements.shift();
      }
    });

    document.addEventListener('click', () => {
      mouseClicks++;
    });

    function showError(msg) {
      document.getElementById('error').textContent = msg;
      document.getElementById('error').style.display = 'block';
    }

    async function runChecks() {
      try {
        // Step 1
        document.getElementById('status').textContent = 'Verifying browser...';
        const canvas = document.createElement('canvas');
        canvas.width = 200;
        canvas.height = 50;
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#6cf';
        ctx.fillText('Gentlecloud ð', 2, 2);
        ctx.fillStyle = 'rgba(102, 204, 255, 0.5)';
        ctx.fillRect(10, 20, 100, 20);
        const canvasData = canvas.toDataURL();
        const fp1 = canvasData.slice(-50);

        if (!fp1 || fp1.length < 10) throw new Error('Verification failed');

        // Step 2
        await new Promise(r => setTimeout(r, 500));

        // Step 3
        document.getElementById('status').textContent = 'Analyzing environment...';
        await new Promise(r => setTimeout(r, 500));
        const env = `${window.screen.width}x${window.screen.height}`;
        const blacklist = ['800x600', '1x1', '0x0'];

        if (blacklist.includes(env)) throw new Error('Environment check failed');

        // Step 4
        const elapsed = Date.now() - startTime;
        const waitTime = Math.max(0, 3000 + Math.random() * 5000 - elapsed);
        if (waitTime > 0) {
          document.getElementById('status').textContent = 'Running security checks...';
          await new Promise(r => setTimeout(r, waitTime));
        }

        document.getElementById('status').textContent = 'Finalizing verification...';

        const resp = await fetch('/challenge/get_challenge', {cache: 'no-store'});
        const data = await resp.json();
        const chal = data.challenge;
        const chalAt = Date.now();
        const diff = data.difficulty || 4;

        let n = 0;
        const dfull = Math.floor(diff);
        const dfrac = diff - dfull;
        const dthr = dfrac > 0 ? Math.max(1, Math.round(16 * (1 - dfrac))) : 16;
        const target = '0'.repeat(dfull);

        while (true) {
          const text = chal + n;
          const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

          if (hashHex.startsWith(target) && parseInt(hashHex[dfull], 16) < dthr) break;
          n++;

          if (n % 1000 === 0) await new Promise(r => setTimeout(r, 0));
          if (n % 20000 === 0) {
            document.getElementById('status').textContent =
              `Finalizing verification... ${Math.round(n / 1000)}k`;
          }
        }

        // Step 6
        document.getElementById('status').textContent = 'Almost done...';
        document.getElementById('bot-check').style.display = 'flex';

        return new Promise((resolve) => {
          let submitted = false;
          document.getElementById('not-bot-checkbox').addEventListener('change', async function() {
            if (!this.checked || submitted) return;
            submitted = true;

            const proof = {
              canvas: fp1,
              mouse_moves: mouseMovements.length,
              mouse_clicks: mouseClicks,
              screen: env,
              ua: navigator.userAgent.slice(0, 100),
              timing: Date.now() - startTime,
              webdriver: navigator.webdriver === true,
              challenge: chal,
              nonce: n,
              timestamp: Date.now()
            };

            try {
              document.getElementById('status').textContent = 'Minting pass...';
              const sinceChal = Date.now() - chalAt;
              if (sinceChal < 3200) {
                await new Promise(r => setTimeout(r, 3200 - sinceChal));
              }
              const vresp = await fetch('/challenge/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(proof),
                cache: 'no-store'
              });

              if (vresp.ok) {
                document.getElementById('status').textContent = 'â Verification complete!';
                setTimeout(() => window.location.href = '/', 1000);
                resolve();
              } else {
                showError('Verification rejected. Retrying...');
                setTimeout(() => window.location.reload(), 2000);
              }
            } catch (e) {
              showError('Network error. Retrying...');
              setTimeout(() => window.location.reload(), 2000);
            }
          });
        });

      } catch (error) {
        showError(error.message || 'Verification failed');
        console.error(error);
      }
    }

    runChecks();
  </script>
</body>
</html>
